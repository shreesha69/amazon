# Browser: chrome, edge, firefox
browser=chrome

# Headless mode
headless=false

# Timeouts (seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Amazon URL
url=https://www.amazon.in

# Category filter
category=Toys

# Test Data Files
input.excel=src/main/resources/testdata/input.xlsx
input.csv=src/main/resources/testdata/input.csv
output.excel=output/data/AmazonProductData.xlsx
output.csv=output/data/AmazonProductData.csv
screenshot.dir=output/screenshots
report.dir=output/reports

# Retry Configuration
retry.count=2

# Email Configuration
email.to=
email.from=
email.host=smtp.gmail.com
email.port=587
email.username=
email.password=
email.subject=Amazon Automation Test Report
