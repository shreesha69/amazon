name: Amazon Automation Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Generate test data
        run: mvn compile exec:java -Dexec.mainClass="com.krce.amazon.utilities.DataGenerator" -q

      - name: Run tests
        run: mvn clean test
        env:
          HEADLESS: "true"
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            output/reports/
            output/screenshots/
            output/data/
            logs/
          retention-days: 7
