# Browser: chrome, edge, firefox
browser=chrome

# Headless mode
headless=false

# Timeouts (seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Amazon URL
url=https://www.amazon.in

# Category filter - use the visible text from Amazon dropdown
category=Toys & Games

# Test Data Files (relative to project root, or absolute paths)
input.excel=src/main/resources/testdata/input.xlsx
input.csv=src/main/resources/testdata/input.csv
output.excel=output/data/AmazonProductData.xlsx
output.csv=output/data/AmazonProductData.csv
screenshot.dir=output/screenshots
report.dir=output/reports
log.dir=logs

# Retry Configuration
retry.count=2

# Email Configuration
# NOTE: For security, set MAIL_USERNAME and MAIL_PASSWORD as environment variables.
# These properties are fallbacks only.
